name: Feature request
description: Suggest an improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Feature
      description: What should OverlayForge be able to do?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why would this help?
    validations:
      required: true
