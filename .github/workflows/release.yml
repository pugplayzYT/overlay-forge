name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Android release signing secrets are not configured." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/overlayforge-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/overlayforge-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Lint and build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean :app:lintRelease :app:assembleRelease

      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk"

      - name: Rename APK and create checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk "OverlayForge-${GITHUB_REF_NAME}.apk"
          sha256sum "OverlayForge-${GITHUB_REF_NAME}.apk" > "OverlayForge-${GITHUB_REF_NAME}.apk.sha256"

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverlayForge-${{ github.ref_name }}
          path: |
            OverlayForge-${{ github.ref_name }}.apk
            OverlayForge-${{ github.ref_name }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            OverlayForge-${{ github.ref_name }}.apk
            OverlayForge-${{ github.ref_name }}.apk.sha256
